name: Build DPS Android APK & Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install tkintermapview pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --collect-all tkintermapview --name GibddMap windows_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/GibddMap.exe

  android-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install buildozer
        run: pip install buildozer "cython<3" virtualenv
      - name: Accept SDK license
        run: sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
      - name: Build APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
